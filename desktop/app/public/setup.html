<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DriveLog 설정</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg:#f4f5f7; --card:#fff; --line:#e3e5e9; --text:#15171a; --sub:#6b7079; --accent:#3e7bfa; --good:#1fa774; --bad:#d64545; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.55 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  header { background:#111214; color:#fff; padding:22px 24px; }
  header h1 { margin:0; font-size:22px; } header p { margin:4px 0 0; color:#9aa0a8; font-size:14px; }
  main { max-width:820px; margin:0 auto; padding:20px 16px 60px; }
  .step { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:12px; overflow:hidden; }
  .step > .hd { display:flex; align-items:center; gap:12px; padding:16px 18px; cursor:pointer; }
  .num { width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:14px; background:var(--line); color:var(--sub); flex:none; }
  .done .num { background:var(--good); color:#fff; }
  .cur .num { background:var(--accent); color:#fff; }
  .hd h2 { font-size:16px; margin:0; flex:1; }
  .hd .st { font-size:13px; color:var(--sub); }
  .bd { padding:0 18px 18px 58px; display:none; }
  .open .bd { display:block; }
  .lock { opacity:.55; }
  button, .btn { display:inline-block; border:0; border-radius:10px; background:var(--accent); color:#fff; padding:10px 18px; font-size:15px; cursor:pointer; text-decoration:none; margin:4px 6px 4px 0; }
  button.ghost, .btn.ghost { background:#eef1f5; color:var(--text); }
  button:disabled { opacity:.5; cursor:default; }
  input { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:15px; margin:4px 0 10px; font-family:inherit; }
  .copy { display:flex; gap:8px; align-items:center; background:#f6f7f9; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin:6px 0; }
  .copy code { flex:1; white-space:pre-wrap; word-break:break-all; font-size:13px; }
  .copy button { padding:6px 12px; font-size:13px; margin:0; }
  .k { color:var(--sub); font-size:13px; margin-top:10px; }
  ol { padding-left:20px; margin:8px 0; } li { margin:4px 0; }
  .qr { display:flex; gap:24px; flex-wrap:wrap; margin:10px 0; } .qr div { text-align:center; font-size:13px; color:var(--sub); } .qr img { width:200px; height:200px; display:block; background:#fff; border:1px solid var(--line); border-radius:10px; }
  .err { background:#fdecec; color:var(--bad); border-radius:10px; padding:10px 12px; margin:10px 0; white-space:pre-wrap; }
  .ok { color:var(--good); font-weight:600; }
  .veh { display:block; width:100%; text-align:left; background:#f6f7f9; color:var(--text); border:1px solid var(--line); }
  .veh.sel { border-color:var(--accent); background:#eaf1ff; }
  .spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite; vertical-align:-2px; margin-right:6px; }
  @keyframes s { to { transform:rotate(360deg); } }
</style>
</head>
<body>
<header><h1>🚗 DriveLog 설정</h1><p>테슬라 출발·주차 알림 + 주행 기록 — 내 PC에서, 내 테슬라 무료 크레딧으로</p></header>
<main id="app"><p><span class="spin"></span>불러오는 중…</p></main>

<script>
let S = null, openIdx = null, busy = false, vehicles = null, notice = '';
const $ = (h) => h;
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const qr = (t) => `<img src="/api/qr?t=${encodeURIComponent(t)}" alt="QR">`;
const copyBox = (v) => `<div class="copy"><code>${esc(v)}</code><button class="ghost" onclick='copyText(${JSON.stringify(v)}, this)'>복사</button></div>`;

async function copyText(v, b) { try { await navigator.clipboard.writeText(v); b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1500); } catch { prompt('복사하세요', v); } }

async function act(name, body = {}, msg) {
  busy = true; notice = msg || ''; render();
  try {
    const r = await fetch(`/api/do/${name}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || '실패');
    openIdx = null;
    return j;
  } catch (e) { S.lastError = e.message; return null; }
  finally { busy = false; notice = ''; await refresh(); }
}

async function refresh() {
  try { S = await (await fetch('/api/state')).json(); } catch { return; }
  render();
}

function steps() {
  const t = S.tailscale, dom = t.domain;
  return [
    {
      title: '이 PC를 인터넷에 연결 (Tailscale, 무료)',
      done: t.state === 'Running' && t.funnel && t.certOK && t.serveApplied,
      status: dom ? dom : t.state,
      body: () => {
        if (t.state === 'NeedsLogin' && t.authUrl) return `<p>공유기 설정 없이 테슬라가 이 PC로 데이터를 보낼 수 있게 해 주는 무료 서비스예요. 구글 계정으로 가입·로그인하세요.</p><a class="btn" href="${esc(t.authUrl)}" target="_blank">Tailscale 로그인</a><p class="k">로그인 후 "Connect"를 누르고 이 화면으로 돌아오면 자동으로 다음 단계로 넘어가요.</p>`;
        if (t.state !== 'Running') return `<p><span class="spin"></span>준비 중이에요… (${esc(t.state)})</p>${t.error ? `<div class="err">${esc(t.error)}</div>` : ''}`;
        if (!t.funnel || !dom) return `<p>인터넷에서 이 PC로 들어오는 통로(Funnel)를 허용해 주세요. 열린 페이지에서 <b>Enable</b>을 누르면 돼요.</p><a class="btn" href="${esc(t.funnelUrl)}" target="_blank">Funnel 허용하기</a><p class="k">허용하면 1분 안에 자동으로 확인돼요.</p>`;
        return `<p><span class="spin"></span>인증서와 통로를 준비하고 있어요… (1~2분)</p>${t.error ? `<div class="err">${esc(t.error)}</div>` : ''}`;
      },
    },
    {
      title: '테슬라 개발자 앱 만들기',
      done: S.app.hasClient,
      status: S.app.hasClient ? 'Client ID 저장됨' : '',
      body: () => `
        <ol>
          <li><a href="https://developer.tesla.com" target="_blank">developer.tesla.com</a>에 테슬라 계정으로 로그인 → <b>2단계 인증</b>을 켜 두세요.</li>
          <li><b>새 애플리케이션 만들기</b> → 아래 값을 복사해서 넣으세요.</li>
        </ol>
        <div class="k">애플리케이션 이름</div>${copyBox(S.app.suggestName)}
        <div class="k">애플리케이션 설명</div>${copyBox('Personal app that notifies me when my own Tesla starts driving or parks, and keeps a private trip log on my own PC.')}
        <div class="k">사용 목적</div>${copyBox('Personal, non-commercial use for my own vehicle only. Uses Fleet Telemetry (gear, location, speed, odometer, battery level) to send drive/park notifications to my phone and store a private trip log on my own computer. Read-only, no vehicle commands, no data shared with third parties.')}
        <div class="k">OAuth 부여 유형</div><p>"인증 코드 및 사물 통신" (기본값 그대로)</p>
        <div class="k">허용되는 출처 URL (두 개 모두, + 버튼으로 추가)</div>${copyBox('http://localhost:3000')}${dom ? copyBox('https://' + dom) : '<p class="k">(1단계를 마치면 두 번째 주소가 여기 나와요)</p>'}
        <div class="k">허용되는 리디렉션 URI</div>${copyBox('http://localhost:3000/callback')}
        <div class="k">API 범위</div><p><b>차량 정보</b>, <b>차량 위치</b> 체크</p>
        <div class="k">청구 정보</div><p>카드 등록 → 청구 한도 <b>사용자 지정, 10원</b> (매달 약 14,000원 무료 할인 안에서 끝나요. 한도를 넘으면 자동으로 멈춰서 큰돈이 나갈 수 없어요)</p>
        <ol start="3"><li>승인되면 <b>세부내역 확인</b>에서 Client ID와 비밀번호(Secret)를 복사해 아래에 붙여 넣으세요.</li></ol>
        <input id="cid" placeholder="Client ID" value="${esc(S.app.clientId)}">
        <input id="csec" placeholder="Client Secret (ta-secret...)" type="password">
        <button ${busy ? 'disabled' : ''} onclick="act('app', { clientId: cid.value, clientSecret: csec.value }, '확인 중…')">저장하고 확인</button>`,
    },
    {
      title: '테슬라에 내 주소 등록',
      done: S.partner,
      status: S.partner ? '등록됨' : S.publicKey ? '공개키 확인됨' : '',
      lock: !S.app.hasClient || !dom,
      body: () => `<p>테슬라 앱의 <b>허용되는 출처 URL</b>에 아래 주소가 들어 있어야 해요.</p>${copyBox('https://' + dom)}
        <p>공개키: ${S.publicKey ? '<span class="ok">인터넷에서 보여요 ✓</span>' : '<span class="spin"></span>확인 중 (Funnel이 열리는 데 1~2분 걸려요)'}</p>
        <button ${busy ? 'disabled' : ''} onclick="act('partner', {}, '등록 중…')">테슬라에 등록하기</button>`,
    },
    {
      title: '테슬라 계정 로그인',
      done: S.loggedIn,
      status: S.loggedIn ? '로그인됨' : '',
      lock: !S.partner,
      body: () => `<p>내 차 데이터를 받을 수 있게 테슬라 계정으로 로그인하세요. <b>차량 정보와 차량 위치 권한을 모두 허용</b>해야 해요.</p><a class="btn" href="/login">테슬라로 로그인</a>`,
    },
    {
      title: '차량 선택 & 가상 키 등록',
      done: !!S.vin && S.paired === true,
      status: S.vin ? `${S.vehicleName || ''} …${S.vin.slice(-6)}${S.paired ? ' · 키 등록됨' : ''}` : '',
      lock: !S.loggedIn,
      body: () => {
        let h = '';
        if (!vehicles) h += `<button ${busy ? 'disabled' : ''} onclick="loadVehicles()">내 차량 불러오기</button>`;
        else h += vehicles.map((v) => `<button class="veh ${v.vin === S.vin ? 'sel' : ''}" onclick="act('vehicle', ${esc(JSON.stringify(v))})">${esc(v.name || '이름 없음')} · ${esc(v.vin)}</button>`).join('');
        if (S.vin) {
          const link = `https://tesla.com/_ak/${dom}?vin=${S.vin}`;
          h += `<p style="margin-top:14px"><b>테슬라 앱이 깔린 휴대폰</b>으로 QR을 찍고 → 앱에서 승인 → 차 안에서 키 카드를 태그하세요.</p><div class="qr"><div>${qr(link)}가상 키 등록</div></div>${copyBox(link)}
            <button ${busy ? 'disabled' : ''} onclick="act('paired', {}, '확인 중… (차가 깨어 있어야 해요)')">등록 확인</button>${S.paired === false ? '<p class="k">아직 확인되지 않아요. 테슬라 앱으로 차를 한 번 열어 깨운 뒤 다시 눌러 보세요.</p>' : ''}`;
        }
        return h;
      },
    },
    {
      title: '휴대폰 알림 받기 (ntfy, 무료)',
      done: S.notify.ok,
      status: S.notify.ok ? '완료' : '',
      lock: !S.vin,
      body: () => {
        const sub = `https://ntfy.sh/${S.notify.topic}`;
        return `<ol><li>휴대폰에 <b>ntfy</b> 앱 설치 (플레이스토어 / 앱스토어)</li><li>앱에서 <b>+</b> → 아래 토픽 이름 입력 → 구독 (또는 휴대폰 카메라로 QR)</li></ol>
          ${copyBox(S.notify.topic)}<div class="qr"><div>${qr(sub)}토픽 열기</div></div>
          <p class="k">토픽 이름이 비밀번호 역할을 해요. 다른 사람에게 알려 주지 마세요.</p>
          <button ${busy ? 'disabled' : ''} class="ghost" onclick="act('notifyTest', {}, '보내는 중…')">테스트 알림 보내기</button>
          <button ${busy ? 'disabled' : ''} onclick="act('notifyOk')">알림 받았어요</button>`;
      },
    },
    {
      title: '차량에 실시간 전송 설정',
      done: !!S.telemetry.exp && S.telemetry.synced,
      status: S.telemetry.exp ? (S.telemetry.synced ? '적용됨' : '보냄 · 차량 적용 대기') : '',
      lock: !S.notify.ok || S.paired !== true,
      body: () => `<p>차가 출발·주차·위치 정보를 이 PC로 보내도록 설정해요.</p>
        <button ${busy ? 'disabled' : ''} onclick="act('configure', {}, '설정 보내는 중… (최대 1분)')">${S.telemetry.exp ? '설정 다시 보내기' : '설정 보내기'}</button>
        ${S.telemetry.exp ? `<button class="ghost" ${busy ? 'disabled' : ''} onclick="act('synced', {}, '확인 중…')">차량 적용 확인</button><p class="k">테슬라 앱으로 차를 한 번 열어 깨우면 몇 분 안에 적용돼요. 만료: ${new Date(S.telemetry.exp * 1000).toLocaleDateString('ko-KR')}</p>` : ''}`,
    },
    {
      title: '완료! 휴대폰에서 주행 기록 보기',
      done: false,
      status: '',
      lock: !S.telemetry.exp,
      body: () => `
        <p>이제 차를 출발·주차하면 알림이 오고 주행 기록이 쌓여요. 🎉</p>
        <div class="qr">
          ${S.dashboardPhone ? `<div>${qr(S.dashboardPhone)}휴대폰으로 주행 기록 열기<br>(홈 화면에 추가하면 앱처럼 써요)</div>` : ''}
          <div>${qr(S.releases)}안드로이드 앱(APK) 받기</div>
          ${S.dashboardPhone ? `<div>${qr('drivelog://connect?u=' + encodeURIComponent(S.dashboardPhone))}앱 설치 후 이 QR로 연결</div>` : ''}
        </div>
        <p>이 PC에서 보기: <a href="${S.dashboardLocal}" target="_blank">${S.dashboardLocal}</a></p>
        <div class="k">알림에 표시할 차 이름</div><input id="cname" value="${esc(S.carName)}"><button class="ghost" onclick="act('carName', { name: cname.value })">저장</button>
        <div class="k">PC가 꺼지거나 잠들면 알림이 멈춰요</div><button class="ghost" onclick="act('noSleep', {}, '설정 중…')">전원 연결 시 절전 모드 끄기</button>
        <p class="k">DriveLog는 Windows를 켤 때 자동으로 실행돼요. 이 화면은 시작 메뉴의 "DriveLog 설정"으로 다시 열 수 있어요.</p>`,
    },
  ];
}

async function loadVehicles() {
  busy = true; notice = '차량 목록을 불러오는 중…'; render();
  try { const r = await fetch('/api/do/vehicles', { method: 'POST' }); const j = await r.json(); if (!r.ok) throw new Error(j.error); vehicles = j; }
  catch (e) { S.lastError = e.message; }
  busy = false; notice = ''; render();
}

function render() {
  if (!S) return;
  const list = steps();
  const cur = list.findIndex((s) => !s.done && !s.lock);
  const focus = document.activeElement?.id;
  const vals = { cid: window.cid?.value, csec: window.csec?.value, cname: window.cname?.value };
  app.innerHTML = list.map((s, i) => {
    const open = openIdx === null ? i === cur : openIdx === i;
    return `<div class="step ${s.done ? 'done' : ''} ${i === cur ? 'cur' : ''} ${s.lock ? 'lock' : ''} ${open ? 'open' : ''}">
      <div class="hd" onclick="openIdx = ${open ? -1 : i}; render()"><div class="num">${s.done ? '✓' : i + 1}</div><h2>${s.title}</h2><div class="st">${esc(s.status || '')}</div></div>
      <div class="bd">${s.lock ? '<p class="k">앞 단계를 먼저 마쳐 주세요.</p>' : s.body()}${open && notice ? `<p><span class="spin"></span>${esc(notice)}</p>` : ''}${open && S.lastError ? `<div class="err">${esc(S.lastError)}</div>` : ''}</div></div>`;
  }).join('');
  for (const [k, v] of Object.entries(vals)) if (v != null && window[k]) window[k].value = v;
  if (focus && window[focus]) window[focus].focus();
}

refresh();
setInterval(() => { if (!busy && !['cid', 'csec', 'cname'].includes(document.activeElement?.id)) refresh(); }, 4000);
</script>
</body>
</html>
