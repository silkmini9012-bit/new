name: Build DriveLog (Windows installer + Android app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLEET_TELEMETRY_REF: v0.10.0

jobs:
  windows-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build drivelog-tunnel.exe (Tailscale Funnel 내장)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          cd desktop/tunnel
          { go get tailscale.com@latest && go mod tidy && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../out/drivelog-tunnel.exe . ; } 2>&1 | tee -a ../../ci.log
      - name: Build fleet-telemetry.exe (Kafka/ZMQ 제외)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch "$FLEET_TELEMETRY_REF" https://github.com/teslamotors/fleet-telemetry ft 2>&1 | tee -a ci.log
          bash desktop/ft-stubs/patch.sh "$PWD/ft" 2>&1 | tee -a ci.log
          cd ft
          { GOFLAGS=-mod=mod GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../out/fleet-telemetry.exe ./cmd ; } 2>&1 | tee -a ../ci.log
      - name: Build tesla-http-proxy.exe (테슬라 공식 서명 프록시)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/teslamotors/vehicle-command vc 2>&1 | tee -a ci.log
          cd vc
          { GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../out/tesla-http-proxy.exe ./cmd/tesla-http-proxy ; } 2>&1 | tee -a ../ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: out/*.exe
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  windows-installer:
    needs: windows-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: stage/bin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage files
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p stage/node stage/app
            cp "$(which node)" stage/node/drivelog-node.exe
            cp -r desktop/app/. stage/app/
            rm -rf stage/app/node_modules stage/app/test
            (cd stage/app && npm install --omit=dev --no-audit --no-fund)
            cp desktop/installer/DriveLog.vbs desktop/installer/icon.ico stage/
            ls -la stage stage/bin
          } 2>&1 | tee -a ci.log
      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          set -o pipefail
          { choco install innosetup -y --no-progress && "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=1.0.${{ github.run_number }}" desktop/installer/DriveLog.iss ; } 2>&1 | tee -a ci.log
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/DriveLog-Setup.exe
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android && gradle :app:assembleRelease --no-daemon 2>&1 | tee -a ../ci.log
          cp app/build/outputs/apk/release/app-release.apk ../DriveLog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: DriveLog.apk
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  smoke-test:
    needs: windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist
      - name: Install silently and check every component starts
        shell: bash
        run: |
          set -o pipefail
          {
            ./dist/DriveLog-Setup.exe //VERYSILENT //SUPPRESSMSGBOXES //NORESTART
            APP="$LOCALAPPDATA/DriveLog"
            ls -la "$APP" "$APP/bin" "$APP/node"
            # 설치 후 자동 실행된 DriveLog가 설정 화면을 띄울 때까지 대기
            ok=""
            for i in $(seq 1 60); do
              s=$(curl -s http://localhost:3000/api/state || true)
              if echo "$s" | grep -q '"authUrl":"https://login.tailscale.com'; then ok=1; break; fi
              sleep 3
            done
            echo "STATE: $s"
            test -n "$ok" || { echo "FAIL: tunnel did not produce a Tailscale login URL"; cat "$APP/data/logs/"*.log; exit 1; }
            echo "OK: wizard + tunnel (Tailscale login URL issued)"
            curl -sf http://localhost:8090/api/trips && echo " OK: local dashboard"
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8091/api/trips); test "$code" = "401" && echo "OK: public dashboard requires token"
            # fleet-telemetry.exe 가 설정 파일로 정상 기동하는지
            mkdir -p /tmp/ft && cd /tmp/ft
            openssl req -x509 -nodes -newkey rsa:2048 -keyout key.pem -out cert.pem -days 1 -subj "//CN=localhost" 2>/dev/null
            W=$(cygpath -w /tmp/ft)
            printf '{"host":"127.0.0.1","port":14443,"log_level":"info","json_log_enable":true,"namespace":"t","reliable_ack":false,"records":{"V":["mqtt"]},"mqtt":{"broker":"127.0.0.1:1883","client_id":"smoke","topic_base":"tesla","qos":1},"tls":{"server_cert":"%s","server_key":"%s"}}' "${W//\\/\\\\}\\\\cert.pem" "${W//\\/\\\\}\\\\key.pem" > cfg.json
            cat cfg.json
            ("$APP/bin/fleet-telemetry.exe" -config "$W\\cfg.json" > ft.log 2>&1 &)
            ft=""
            for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/14443) 2>/dev/null && { ft=1; break; }; sleep 1; done
            cat ft.log | head -30
            test -n "$ft" || { echo "FAIL: fleet-telemetry did not listen"; exit 1; }
            echo "OK: fleet-telemetry listening"
            # 서명 프록시가 정상 기동하는지
            TESLA_HTTP_PROXY_TLS_CERT="$W\\cert.pem" TESLA_HTTP_PROXY_TLS_KEY="$W\\key.pem" TESLA_HTTP_PROXY_HOST=127.0.0.1 TESLA_HTTP_PROXY_PORT=14444 TESLA_KEY_FILE="$(cygpath -w "$APP/data/proxy/private-key.pem")" "$APP/bin/tesla-http-proxy.exe" > px.log 2>&1 &
            px=""
            for i in $(seq 1 20); do (echo > /dev/tcp/127.0.0.1/14444) 2>/dev/null && { px=1; break; }; sleep 1; done
            cat px.log | head -20
            test -n "$px" || { echo "FAIL: proxy did not listen"; exit 1; }
            echo "OK: tesla-http-proxy listening"
            echo "ALL SMOKE TESTS PASSED"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/ci.log"
      - name: Save test log
        if: always()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "smoke log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  release:
    needs: [windows-installer, android, smoke-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DriveLog v1.0.${{ github.run_number }}
          body: |
            ## 설치 방법
            1. **Windows PC**: `DriveLog-Setup.exe` 를 받아서 실행하세요. 설치가 끝나면 설정 화면이 브라우저에 열려요.
               - "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** 을 누르세요.
            2. **안드로이드 폰**: `DriveLog.apk` 를 받아서 설치한 뒤, PC 설정 화면 마지막 단계의 QR로 연결하세요.
          files: |
            dl/DriveLog-Setup.exe
            dl/DriveLog.apk
