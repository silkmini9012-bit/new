name: Build DriveLog (Windows installer + Android app)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLEET_TELEMETRY_REF: v0.10.0

jobs:
  windows-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build drivelog-tunnel.exe (Tailscale Funnel 내장)
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out
          cd desktop/tunnel
          { go get tailscale.com@latest && go mod tidy && GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../../out/drivelog-tunnel.exe . ; } 2>&1 | tee -a ../../ci.log
      - name: Build fleet-telemetry.exe (Kafka/ZMQ 제외)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 --branch "$FLEET_TELEMETRY_REF" https://github.com/teslamotors/fleet-telemetry ft 2>&1 | tee -a ci.log
          bash desktop/ft-stubs/patch.sh "$PWD/ft" 2>&1 | tee -a ci.log
          cd ft
          { GOFLAGS=-mod=mod GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../out/fleet-telemetry.exe ./cmd ; } 2>&1 | tee -a ../ci.log
      - name: Build tesla-http-proxy.exe (테슬라 공식 서명 프록시)
        shell: bash
        run: |
          set -o pipefail
          git clone --depth 1 https://github.com/teslamotors/vehicle-command vc 2>&1 | tee -a ci.log
          cd vc
          { GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o ../out/tesla-http-proxy.exe ./cmd/tesla-http-proxy ; } 2>&1 | tee -a ../ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: out/*.exe
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  windows-installer:
    needs: windows-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: stage/bin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage files
        shell: bash
        run: |
          set -o pipefail
          {
            mkdir -p stage/node stage/app
            cp "$(which node)" stage/node/drivelog-node.exe
            cp -r desktop/app/. stage/app/
            rm -rf stage/app/node_modules stage/app/test
            (cd stage/app && npm install --omit=dev --no-audit --no-fund)
            cp desktop/installer/DriveLog.vbs desktop/installer/icon.ico stage/
            ls -la stage stage/bin
          } 2>&1 | tee -a ci.log
      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          set -o pipefail
          { choco install innosetup -y --no-progress && "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "//DAppVersion=1.0.${{ github.run_number }}" desktop/installer/DriveLog.iss ; } 2>&1 | tee -a ci.log
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/DriveLog-Setup.exe
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          cd android && gradle :app:assembleRelease --no-daemon 2>&1 | tee -a ../ci.log
          cp app/build/outputs/apk/release/app-release.apk ../DriveLog.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: DriveLog.apk
      - name: Save build log on failure
        if: failure()
        shell: bash
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          cp ci.log /tmp/ci.log || echo "no log" > /tmp/ci.log
          git checkout --orphan "ci-logs-${{ github.job }}"; git rm -rf --cached . > /dev/null; cp /tmp/ci.log ci.log
          git add -f ci.log; git commit -qm "build log"; git push -f origin "HEAD:ci-logs-${{ github.job }}"

  release:
    needs: [windows-installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dl
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: DriveLog v1.0.${{ github.run_number }}
          body: |
            ## 설치 방법
            1. **Windows PC**: `DriveLog-Setup.exe` 를 받아서 실행하세요. 설치가 끝나면 설정 화면이 브라우저에 열려요.
               - "Windows의 PC 보호" 창이 뜨면 **추가 정보 → 실행** 을 누르세요.
            2. **안드로이드 폰**: `DriveLog.apk` 를 받아서 설치한 뒤, PC 설정 화면 마지막 단계의 QR로 연결하세요.
          files: |
            dl/DriveLog-Setup.exe
            dl/DriveLog.apk
