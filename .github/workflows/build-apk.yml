name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk DriveLog.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DriveLog-apk
          path: DriveLog.apk

      - name: Publish release (폰에서 바로 다운로드)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: 주행 기록 앱 v1.0.${{ github.run_number }}
          body: |
            아래 **DriveLog.apk** 를 폰에서 눌러 설치하세요.
            (처음 설치할 때 "출처를 알 수 없는 앱 설치"를 허용해야 해요)
          files: DriveLog.apk
